<!DOCTYPE html>
<html lang="en">
<head>
    <title>Admin Dashboard</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    >
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-3">
                <h2>Admin Dashboard</h2>
                <p class="text-muted">Welcome, Admin</p>
                <hr>
            </div>
        </div>

        <div class="row g-3">
            <div class="col-md-3">
            <a href="{{ url_for('admin.manage_treks') }}" class="text-decoration-none text-dark">
                <div class="card text-center p-3">
                    <h6 class="text-muted">Total Treks</h6>
                    <h2>{{ total_treks }}</h2>
                </div>
            </a>
        </div>

            <div class="col-md-3">
                <div class="card text-center p-3">
                    <h6 class="text-muted">Total Users</h6>
                    <h2>{{ total_users }}</h2>
                </div>
            </div>

            <div class="col-md-3">
                <div class="card text-center p-3">
                    <h6 class="text-muted">Total Staff</h6>
                    <h2>{{ total_staff }}</h2>
                </div>
            </div>
            
            <div class="col-md-3">
                <div class="card text-center p-3">
                    <h6 class="text-muted">Total Bookings</h6>
                    <h2>{{ total_bookings }}</h2>
                </div>
            </div>
        </div>
    </div>

    <a href="{{ url_for('auth.logout') }}" class="btn btn-danger" style="position: relative; left: 1400px; bottom: -50px;">Logout</a>


</body>
</html>
