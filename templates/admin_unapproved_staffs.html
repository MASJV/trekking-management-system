<!DOCTYPE html>
<html lang="en">
<head>
    <title>Approve Staff</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
            <h2>Approve Staff</h2>
            <a href="{{ url_for('admin.manage_staff') }}" class="btn btn-secondary btn-sm mb-3">Back To Staff Management</a>

            <table class="table table-bordered">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Status</th>
                        <th>Approve/Remove Staff</th>
                    </tr>
                </thead>
                <tbody>
                    {% for staff in staffs %}
                    <tr>
                        <td>{{staff.staff_id}}</td>
                        <td>{{staff.name}}</td>
                        <td>{{staff.email}}</td>
                        <td>{{staff.status.capitalize()}}</td>
                        <td>
                            <form method="POST" action="{{ url_for('admin.approve_staff', staff_id=staff.staff_id) }}" style="display:inline">
                                <button type="submit" class="btn btn-success btn-sm" onclick="return confirm('Approve this staff?')">Approve</button>
                            </form>
                            <form method="POST" action="{{ url_for('admin.delete_staff', staff_id=staff.staff_id) }}" style="display:inline">
                                <button type="submit" class="btn btn-danger btn-sm" onclick="return confirm('Delete this staff?')">Delete</button>
                            </form>
                        </td>

                    </tr>
                    {% endfor %}
                </tbody>
            </table>
    </div>
</body>
