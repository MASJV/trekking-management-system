<!DOCTYPE html>
<html lang="en">
<head>
    <title>Manage Users</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
            <h2>Manage Users</h2>
            <a href="{{ url_for('admin.admin_dashboard') }}" class="btn btn-secondary btn-sm mb-3">Back</a>

            <table class="table table-striped">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Is_Blacklisted</th>
                        <th>Blacklist Trekker</th>
                    </tr>
                </thead>
                <tbody>
                    {% for user in users %}
                    <tr>
                        <td>{{user.user_id}}</td>
                        <td>{{user.name}}</td>
                        <td>{{user.email}}</td>
                        <td>{{user.is_blacklisted}}</td>
                        <td>
                            <form method="POST" action="{{ url_for('admin.blacklist_user', user_id=user.user_id) }}" style="display:inline">
                                <button type="submit" class="btn btn-danger btn-sm" onclick="return confirm('Blacklist this user?')">Blacklist</button>
                            </form>
                            <form method="POST" action="{{ url_for('admin.unblacklist_user', user_id=user.user_id) }}" style="display:inline">
                                <button type="submit" class="btn btn-success btn-sm" onclick="return confirm('Unblacklist this user?')">UnBlacklist</button>
                            </form>
                        </td>

                    </tr>
                    {% endfor %}
                </tbody>
            </table>
    </div>
</body>
