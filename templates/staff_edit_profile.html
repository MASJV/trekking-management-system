{% extends "base.html" %}
{% block title %}Edit Profile{% endblock %}
{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-4">
            <h3 class="text-center mb-4">Edit Profile</h3>

            <form method="POST" action="{{ url_for('staff.edit_profile', staff_id=current_user.staff_id) }}">
                <div class="mb-3">
                    <label class="form-label">Name</label>
                    <input type="text" name="name" class="form-control" value="{{ data.get('staff_name','') }}" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" name="email" class="form-control" value="{{ data.get('email','') }}" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Phone Number</label>
                    <input type="text" name="phone_number" class="form-control" value="{{ data.get('phone_number','') }}" pattern="[0-9]{10}" maxlength="10" title="Enter a 10-digit phone number" required>
                </div>

                <button type="submit" class="btn btn-primary">Save Changes</button>
                <a href="{{ url_for('staff.staff_dashboard') }}" class="btn btn-secondary">Cancel</a>
            </form>

        </div>
    </div>
</div>
{% endblock %}
