<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Profile</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-4">
                <h3 class="text-center mb-4">Edit Profile</h3>
                
                <form method="POST" action="{{ url_for('user.edit_profile', user_id=current_user.user_id) }}">
                    <div class="mb-3">
                        <label class="form-label">Name</label>
                        <input type="text" name="name" class="form-control" value="{{ data.get('name','') }}" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" name="email" class="form-control" value="{{ data.get('email','') }}" required>
                    </div>

                    <!-- <div class="mb-3">
                        <label class="form-label">Phone Number</label>
                        <input type="text" name="phone_number" class="form-control" value="{{ data.get('phone_number','') }}" required>
                    </div> -->

                    <button type="submit" class="btn btn-primary">Save Changes</button>
                    <a href="{{ url_for('user.user_dashboard') }}" class="btn btn-secondary">Cancel</a>
                </form>

            </div>    
        </div>
    </div>
</body>
</html>
